
services:

  database:
    image: mariadb:latest # Database MariaDB
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_DATABASE}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD}
#    ports:
#      - "${DB_PORT}:3306"
    volumes:
      - ./database:/var/lib/mysql
    restart: unless-stopped

  wordpress:
    image: wordpress:fpm # Variante Wordpress com FPM
    environment:
      - WORDPRESS_DB_HOST=${DB_HOST}
      - WORDPRESS_DB_USER=${DB_USER}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD}
      - WORDPRESS_DB_NAME=${DB_DATABASE}
#    ports:
#      - '9000:9000'
    volumes:
      - ./wordpress:/var/www/html
      - ./custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini # Configurações do PHP
      - ./info.php:/var/www/html/info.php # Comente/Remova essa linha em produção
    restart: unless-stopped
    depends_on:
      - database

  nginx:
    image: nginx:latest # Serviço Web Nginx
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"      
    volumes:
      - ./wordpress:/var/www/html # Acesso aos arquivos do WordPress
      - ./custom-nginx.conf:/etc/nginx/conf.d/default.conf # Configurações do Nginx
      - ./nginx.crt:/etc/nginx/ssl/nginx.crt
      - ./nginx.key:/etc/nginx/ssl/nginx.key
    restart: unless-stopped
    depends_on:
      - wordpress
